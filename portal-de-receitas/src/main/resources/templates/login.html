<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; form-action 'self' https://turbo-space-palm-tree-jj56jx74vx5xfp579-8081.app.github.dev;">
    
    <link rel="stylesheet" href="/css/styles.css"> <!-- Link para o arquivo CSS -->
    <script src="/js/script.js" defer></script> <!-- Link para o arquivo JavaScript -->
</head>
<body>
    <h1>Login</h1>
    <form action="https://turbo-space-palm-tree-jj56jx74vx5xfp579-8081.app.github.dev/login" method="post">
        <div>
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <button type="submit">Entrar</button>
        </div>
    </form>
    <div>
        <p>Não tem uma conta? <a href="/register">Registre-se</a></p>
    </div>
</body>
</html>
