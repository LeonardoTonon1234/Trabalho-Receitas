<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal de Receitas</title>
    <link rel="stylesheet" href="/css/styles.css"> <!-- Certifique-se de que styles.css está no caminho correto -->
</head>
<body>
    <header>
        <div class="logo">
            <img src="/imagem/logo.png" alt="Logo Portal de Receitas"> <!-- Certifique-se de que logo.png está no caminho correto -->
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li> <!-- Ajustado para redirecionar para a rota raiz (home) -->
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div id="login-form">
                <h1>Login</h1>
                <form id="loginForm" method="POST" action="/api/usuarios/login">
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                    </div>
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                    </div>
                    <button type="submit" class="btn">Entrar</button>
                </form>
                <a class="toggle-link" onclick="toggleForms()">Não tem uma conta? Registre-se</a>
            </div>

            <div id="register-form" style="display: none;">
                <h1>Registro</h1>
                <form id="registerForm" method="POST" action="/api/usuarios">
                    <div class="form-group">
                        <label for="name">Nome Completo:</label>
                        <input type="text" id="name" name="name" required placeholder="Digite seu nome completo">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="emailRegister" name="email" required placeholder="Digite seu e-mail">
                    </div>
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="passwordRegister" name="password" required placeholder="Crie uma senha">
                    </div>
                    <button type="submit" class="btn">Registrar</button>
                </form>
                <a class="toggle-link" onclick="toggleForms()">Já tem uma conta? Faça login</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Portal de Receitas. Todos os direitos reservados.</p>
    </footer>

    <script>
        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }
    </script>
</body>
</html>
