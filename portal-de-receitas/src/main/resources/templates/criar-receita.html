<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Receita</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin: 20px auto;
        }

        .form-container h1 {
            text-align: center;
            color: #660000;
            margin-bottom: 20px;
        }

        .form-container label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #660000;
        }

        .form-container input,
        .form-container textarea,
        .form-container select,
        .form-container button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .form-container button {
            background-color: #ff8c00;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .form-container button:hover {
            background-color: #e55a00;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="/imagem/logo.png" alt="Logo Portal de Receitas">
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/ver-receitas">Ver Receitas</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1>Criar Nova Receita</h1>
            <form id="create-recipe-form">
                <label for="recipe-name">Nome da Receita:</label>
                <input type="text" id="recipe-name" name="name" required>

                <label for="recipe-description">Descrição:</label>
                <textarea id="recipe-description" name="description" rows="4" required></textarea>

                <label for="recipe-category">Categoria:</label>
                <select id="recipe-category" name="category" required>
                    <option value="">Selecione uma Categoria</option>
                </select>

                <label for="recipe-ingredients">Ingredientes:</label>
                <textarea id="recipe-ingredients" name="ingredients" placeholder="Exemplo: 2 xícaras de farinha, 1 ovo..." rows="4" required></textarea>

                <label for="recipe-steps">Passos:</label>
                <textarea id="recipe-steps" name="steps" placeholder="Exemplo: Misture os ingredientes, asse no forno..." rows="4" required></textarea>

                <button type="submit">Salvar Receita</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Portal de Receitas. Todos os direitos reservados.</p>
    </footer>

    <script src="/js/criar-receita.js"></script>
</body>
</html>
