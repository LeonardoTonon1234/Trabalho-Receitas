<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurar Receitas - Portal de Receitas</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* Estilo adicional específico para a página */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        main h1 {
            color: white;
            background-color: rgba(102, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .search-container input,
        .search-container select,
        .search-container button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .search-container button {
            background-color: #ff8c00;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .search-container button:hover {
            background-color: #e55a00;
        }

        .recipes-container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: #660000;
        }

        .recipe-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .recipe-card h3 {
            margin-bottom: 10px;
        }

        .recipe-card p {
            margin-bottom: 20px;
        }

        .recipe-card button {
            background-color: #ff8c00;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
        }

        .recipe-card button:hover {
            background-color: #e55a00;
        }

        .create-recipe-container {
            margin-top: 20px;
        }

        .create-recipe-container button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .create-recipe-container button:hover {
            background-color: #218838;
        }

        footer {
            background-color: #660000;
            text-align: center;
            padding: 20px 0;
            color: white;
            font-size: 14px;
            position: absolute;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="/imagem/logo.png" alt="Logo Portal de Receitas">
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Procurar Receitas</h1>
        <div class="search-container">
            <input type="text" id="search-name" placeholder="Buscar por nome">
            <select id="search-category">
                <option value="">Todas as Categorias</option>
            </select>
            <input type="text" id="search-ingredient" placeholder="Buscar por ingrediente">
            <button id="search-button">Buscar</button>
        </div>
        <div class="recipes-container" id="results-container">
            <h2>Receitas Disponíveis</h2>
            <p>Nenhuma receita encontrada.</p>
        </div>
        <!-- Botão para criar receita (apenas visível para usuários logados) -->
        <div class="create-recipe-container" id="create-recipe-container" style="display: none;">
            <button onclick="redirectToCreateRecipe()">Criar Nova Receita</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Portal de Receitas. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Verifica se o usuário está autenticado e exibe o botão de criar receita
        function checkAuthentication() {
            fetch('/api/usuarios/autenticado')
                .then(response => response.json())
                .then(authenticated => {
                    if (authenticated) {
                        document.getElementById('create-recipe-container').style.display = 'block';
                    }
                })
                .catch(error => console.error("Erro ao verificar autenticação:", error));
        }

        // Redireciona para a página de criação de receitas
        function redirectToCreateRecipe() {
            window.location.href = "/criar-receita";
        }

        document.addEventListener("DOMContentLoaded", function () {
            checkAuthentication();
        });
    </script>
    <script src="/js/ver-receitas.js"></script>
</body>
</html>
